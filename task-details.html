<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
<meta charset="UTF-8">
<title>Task Details</title>
<link rel="stylesheet" href="style.css">
</head>
<body ng-controller="TaskController">
<header>
<div class="header-brand">
<img src="images/logo.png" class="header-logo">
<h2>{{organizationName}}</h2>
</div>
<nav class="top-right-nav">
<a href="profile.html">Profile</a>
<a href="login.html" class="login-btn">Logout</a>
</nav>
</header>
<div class="app-container">
<aside class="sidebar">
<h3>Volunteer Menu</h3>
<ul class="sidebar-nav">
<li><a href="profile.html">Profile</a></li>
<li><a class="active" href="task-details.html">Tasks</a></li>
</ul>
</aside>
<div class="main-content">
<div class="card">
<h2>Task Details</h2>
<p>View and manage assigned disaster tasks.</p>
<table>
<tr>
<th>Task Name</th>
<th>Location</th>
<th>Status</th>
<th>Action</th>
</tr>
<tr ng-repeat="task in tasks">

    <td>{{task.name}}</td>

    <td>{{task.location}}</td>

    <td>
        <span class="badge" task-status>
            {{task.status}}
        </span>
    </td>

    <td>
        <button
            class="btn"
            ng-click="acceptTask(task)"
            ng-disabled="task.status == 'Accepted'">

            {{task.button}}

        </button>
    </td>

</tr>

</table>
</div>
<div class="card">
<h2>Task Notification</h2>
<button class="btn" ng-click="checkNotification()">Check Notification</button>
<p>{{notification}}</p>
</div>
</div>
</div>
<footer>
<p>© 2026 Disaster Volunteering Network</p>
</footer>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<script src="script.js"></script>
<audio id="notificationSound">
<source src=audio/alexis_gaming_cam-accepter-2-394924.mp3 type="audio/mpeg">
</audio>
</body>
</html>
