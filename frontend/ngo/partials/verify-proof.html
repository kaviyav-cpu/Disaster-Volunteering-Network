<div class="page">
  <h2 class="page-title">Verify Proof</h2>

  <div class="panel proof-card" ng-repeat="s in vm.submissions">
    <h3>{{ ::s.volunteerName }} &middot; {{ vm.taskTitle(s.task) }}</h3>
    <p class="muted">Submitted {{ ::s.submittedAt }}</p>
    <p>{{ s.comments }}</p>
    <div ng-if="s.imageProof" class="proof-image-wrap">
      <p class="muted" style="margin-bottom:6px;">Uploaded field verification photo</p>
      <img ng-src="{{ s.imageProof }}" alt="Volunteer proof photo" class="proof-image">
    </div>

    <span class="pill" ng-class="{'pill-approved': s.status==='Approved', 'pill-pending': s.status==='Pending', 'pill-closed': s.status==='Rejected'}">{{ s.status }}</span>

    <div ng-if="s.status === 'Pending'" class="verify-controls">
      <label>Remarks
        <textarea ng-model="vm.remarksDraft[s.id]" rows="2" placeholder="Optional remarks..."></textarea>
      </label>
      <div class="admin-actions">
        <button class="btn-approve" ng-click="vm.verify(s)">Verify</button>
        <button class="btn-reject" ng-click="vm.reject(s)">Reject</button>
      </div>
    </div>
    <p class="muted" ng-if="s.status !== 'Pending' && s.adminFeedback">Remarks: {{ s.adminFeedback }}</p>
  </div>
</div>
