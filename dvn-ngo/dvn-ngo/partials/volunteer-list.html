<div class="page">
  <h2 class="page-title">Volunteer List</h2>
  <p class="page-subtitle">Volunteers approved for your tasks</p>

  <div class="search-row">
    <input type="text" ng-model="vm.searchText" placeholder="Search volunteers..." class="search-input">
  </div>

  <div class="panel">
    <table class="app-table">
      <thead><tr><th>Name</th><th>Skills</th><th>Tasks</th></tr></thead>
      <tbody>
        <tr ng-repeat="v in vm.volunteers | filter: vm.searchText">
          <td ng-bind="v.name"></td>
          <td>
            <span class="req-chip" ng-repeat="skill in v.skills">{{ skill }}</span>
          </td>
          <td>{{ v.tasksCount }}</td>
        </tr>
      </tbody>
    </table>
    <p class="empty-state" ng-if="vm.volunteers.length === 0">No approved volunteers yet.</p>
  </div>
</div>
