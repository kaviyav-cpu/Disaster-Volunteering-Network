<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>

    <link rel="stylesheet" href="style.css">

    <!-- AngularJS Library -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <!-- Your JavaScript -->
    <script src="script.js" defer></script>
</head>
<body ng-app="myApp" ng-controller="ProfileController">
  <header>
    <div class="header-brand">
      <img src="C:\Users\mithr\Documents\Disaster_Volunteering\logo\logo.png" alt="Logo" class="header-logo">
      <h1>User Profile</h1>
    </div>
    <nav>
      <a href="volunteer-dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main class="auth-container" style="max-width: 600px;">
    <section class="card" style="text-align: center;">
      <figure>
        <img src="avatar-placeholder.png" alt="Profile Picture" style="width: 100px; height: 100px; border-radius: 50%; background: #ddd; margin: 0 auto;">
        <figcaption style="margin-top: 0.5rem; color: #666;">
           {{volunteer.name}} (Verified Volunteer)
        </figcaption>
      </figure>

     <div style="text-align: left; margin-top: 1rem;">

    <p><strong>Organization:</strong> {{organization}}</p>

    <p><strong>Email:</strong> {{volunteer.email}}</p>

    <p><strong>Location:</strong> {{volunteer.location}}</p>

    <h4 style="margin-top: 1rem;">Skills & Badges:</h4>

    <div id="badgeContainer"
         style="margin-top: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">

        <span class="badge" ng-repeat="skill in volunteer.skills">
            {{skill}}
        </span>

    </div>
<div>
   <button class="btn"
        style="margin-top: 1rem; width:100%;"
        ng-click="addSkill()">
    + Add New Skill Tag
</button>
</div>

   

</div>

      
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Disaster Volunteering Network</p>
  </footer>
</body>
</html>
