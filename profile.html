<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile - Disaster Volunteering Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="header-brand">
      <img src="C:\Users\mithr\Pictures\Screenshots\Screenshot 2026-07-16 233421.png" alt="Logo" class="header-logo">
      <h1>User Profile</h1>
    </div>
    <nav>
      <a href="volunteer-dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main class="auth-container" style="max-width: 600px;">
    <section class="card" style="text-align: center;">
      <figure>
        <img src="avatar-placeholder.png" alt="Profile Picture" style="width: 100px; height: 100px; border-radius: 50%; background: #ddd; margin: 0 auto;">
        <figcaption style="margin-top: 0.5rem; color: #666;">Jane Doe (Verified Volunteer)</figcaption>
      </figure>

      <div style="text-align: left; margin-top: 1rem;">
        <p><strong>Email:</strong> jane.doe@example.com</p>
        <p><strong>Location:</strong> California, USA</p>
        
        <h4 style="margin-top: 1rem;">Skills & Badges:</h4>
        <div id="badgeContainer" style="margin-top: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <span class="badge">EMT First Aid</span>
          <span class="badge">Water Rescue</span>
        </div>

        <button class="btn" style="margin-top: 1rem; width:100%;" onclick="addSkill()">+ Add New Skill Tag</button>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Disaster Volunteering Network</p>
  </footer>
</body>
</html>
